# Prüfungen ohne laufende APEX-Instanz: Vertrag (nur dokumentierte APEX-API, kein Theme-Markup), Syntax,
# Versionsnummer (application.apx = CHANGELOG). Der Browsertest (npm test) braucht eine Instanz, siehe README "Test".
name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
